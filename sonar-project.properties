# These keys must match the frontend project in SonarQube Cloud.
sonar.organization=uvormbrock
sonar.projectKey=uvormbrock_agentic-order-service-ui
sonar.projectName=Agentic Order Service UI
sonar.host.url=https://sonarcloud.io

sonar.sources=src
sonar.sourceEncoding=UTF-8
sonar.typescript.tsconfigPaths=tsconfig.json
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Analyze application code only, excluding generated declarations and test code.
sonar.exclusions=src/shared/api/schema.d.ts,src/test/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts,**/*.spec.tsx
